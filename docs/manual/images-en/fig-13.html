<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "Noto Sans", Arial, sans-serif; background: #ffffff; }
  .panel { width: 1076px; border: 1px solid #d4d4d4; border-radius: 10px; overflow: hidden; background: #fff; }
  .titlebar { display: flex; align-items: center; gap: 8px; background: #f3f4f6; border-bottom: 1px solid #e5e7eb; padding: 12px 18px; }
  .titlebar .dot { width: 12px; height: 12px; border-radius: 50%; background: #d1d5db; }
  .titlebar .title { margin-left: 10px; font-size: 17px; color: #4b5563; }
  .rows { padding: 10px 0 14px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 7px 20px 7px 14px; font-size: 17.5px; color: #1f2937; }
  .badge-space { width: 30px; flex: 0 0 30px; }
  .badge { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 50%; background: #2563eb; color: #fff; font-size: 17px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; }
  .ico { width: 20px; height: 16px; flex: 0 0 20px; border-radius: 3px; }
  .ico.dir  { background: #fbbf24; clip-path: polygon(0 20%, 22% 20%, 34% 0, 100% 0, 100% 100%, 0 100%); }
  .ico.png  { background: #60a5fa; }
  .ico.csv  { background: #34d399; }
  .ico.json { background: #a78bfa; }
  .name { font-family: "Segoe UI", "Noto Sans Mono", Consolas, monospace; }
</style></head>
<body>
  <div class="panel">
    <div class="titlebar">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="title">Sample-01-preprocess.zip</span>
    </div>
    <div class="rows"><div class="row"><span class="badge-space"></span><span class="ico png"></span><span class="name">aligned_tissue_image.png</span></div>
<div class="row"><span class="badge">1</span><span class="ico dir"></span><span class="name">derived-assets</span></div>
<div class="row"><span class="badge-space"></span><span class="ico json"></span><span class="name">project.json</span></div>
<div class="row"><span class="badge-space"></span><span class="ico json"></span><span class="name">scalefactors_json.json</span></div>
<div class="row"><span class="badge-space"></span><span class="ico dir"></span><span class="name">source-assets</span></div>
<div class="row"><span class="badge-space"></span><span class="ico png"></span><span class="name">spot_image.png</span></div>
<div class="row"><span class="badge">2</span><span class="ico png"></span><span class="name">tissue_fullres_image.png</span></div>
<div class="row"><span class="badge-space"></span><span class="ico png"></span><span class="name">tissue_hires_image.png</span></div>
<div class="row"><span class="badge-space"></span><span class="ico png"></span><span class="name">tissue_lowres_image.png</span></div>
<div class="row"><span class="badge-space"></span><span class="ico csv"></span><span class="name">tissue_matrix.csv</span></div>
<div class="row"><span class="badge-space"></span><span class="ico csv"></span><span class="name">tissue_positions.csv</span></div></div>
  </div>
</body></html>
